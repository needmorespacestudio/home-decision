name: Cooling configuration and regression tests
on:
  push:
    branches: [main, sprint/**]
  pull_request:
permissions:
  contents: read
jobs:
  decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Runtime mirrors
        run: |
          node scripts/sync-cooling-layer.cjs --check
          node scripts/sync-analytics-layer.cjs --check
      - name: Beta analytics
        run: node tests/test_beta_analytics.cjs
      - name: Beta actions
        run: node tests/test_beta_actions.cjs
      - name: Supervised beta export and summary
        run: |
          node tests/test_beta_study.cjs
          python3 -m unittest discover -s tests -p 'test_beta_summary.py'
      - name: Beta scenarios
        run: node tests/test_beta_scenarios.cjs
      - name: Cooling Load V2
        run: node tests/test_cooling_load_v2.cjs
      - name: Residential survey V3
        run: node tests/test_residential_v3.cjs
      - name: Chromium mobile and desktop MVP journeys
        run: node tests/browser_mvp_smoke.cjs
      - name: Configuration
        run: node tests/test_configuration.cjs
      - name: Configuration V2 shadow screening
        run: node tests/test_configuration_v2_shadow.cjs
      - name: Configuration V2 comparison and validation gates
        run: |
          node tests/test_configuration_v2_comparison.cjs
          node scripts/compare-configuration-v2.cjs
      - name: Engineering calibration fixtures (non-certified)
        run: node tests/test_engineering_cases.cjs
      - name: HVAC expert evidence gate (must remain unapproved without reviews)
        run: |
          node tests/test_hvac_expert_evidence.cjs
          node scripts/check-hvac-expert-evidence.cjs
      - name: Recommendation
        run: node tests/test_recommendation.cjs
      - name: PWA
        run: node tests/test_pwa.cjs
      - name: Production SKU provenance and readiness audit
        run: node scripts/catalog_readiness_audit.cjs
      - name: Catalog evidence regression
        run: python3 -m unittest discover -s tests -p 'test_catalog*.py'
      - name: Catalog mirror
        run: python3 scripts/catalog_watcher.py --check-mirror --output-dir reports/run
