name: Cooling configuration and regression tests
on:
  push:
    branches: [main, sprint/cooling-configuration-zoning]
  pull_request:
permissions:
  contents: read
jobs:
  decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configuration runtime mirror and representative scenarios
        run: |
          node scripts/sync-cooling-layer.cjs --check
          node tests/test_configuration.cjs
          node tests/test_recommendation.cjs
          node tests/test_pwa.cjs
      - name: Catalog evidence and mirror regression
        run: |
          python3 -m unittest discover -s tests -p 'test_catalog*.py'
          python3 scripts/catalog_watcher.py --check-mirror --output-dir reports/run
